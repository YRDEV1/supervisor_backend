[project]
name = "supervisor-dashboard-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.139.0",
    "jwt>=1.4.0",
    "pydantic-settings>=2.14.2",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.50.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "paramiko>=5.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
]
